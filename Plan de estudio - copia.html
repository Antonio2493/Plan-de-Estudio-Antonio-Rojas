<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan de Estudio y Fechas Importantes - Informática Educativa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 md:p-8">
        
        <!-- Título -->
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800 text-center mb-2">
            🎓 Mi Panel Académico
        </h1>
        <p class="text-center text-slate-500 text-sm mb-6">Gestiona tus materias y tus fechas importantes en un solo lugar</p>

        <!-- Pestañas de Navegación -->
        <div class="flex justify-center gap-2 mb-8 border-b pb-4">
            <button onclick="cambiarVista('plan')" id="btn-vista-plan" class="px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-800 text-white shadow-sm">
                📚 Plan de Estudio
            </button>
            <button onclick="cambiarVista('calendario')" id="btn-vista-calendario" class="px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-200 text-slate-700 hover:bg-slate-300">
                📅 Fechas Importantes
            </button>
        </div>
        

        <!-- ================= VISTA 1: PLAN DE ESTUDIO ================= -->
        <div id="vista-plan">
            <!-- Tarjetas de Resumen en Tiempo Real -->
            <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <p class="text-sm text-blue-600 font-medium">Total</p>
                    <p id="total-count" class="text-2xl font-bold text-blue-700">0</p>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
                    <p class="text-sm text-emerald-600 font-medium">Pasadas</p>
                    <p id="passed-count" class="text-2xl font-bold text-emerald-700">0</p>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg p-4">
                    <p class="text-sm text-amber-600 font-medium">Restantes</p>
                    <p id="remaining-count" class="text-2xl font-bold text-amber-700">0</p>
                </div>
            </div>

            <!-- Botones de Filtro -->
            <div class="flex flex-wrap justify-center gap-2 mb-6">
                <button onclick="filtrar('todas')" class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium hover:bg-slate-700 transition">Todas</button>
                <button onclick="filtrar('aprobadas')" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-sm font-medium hover:bg-emerald-500 transition">Aprobadas</button>
                <button onclick="filtrar('restantes')" class="px-4 py-2 bg-amber-600 text-white rounded-lg text-sm font-medium hover:bg-amber-500 transition">Restantes</button>
            </div>

            <!-- Lista de Materias -->
            <div id="materias-list" class="space-y-3"></div>
        </div>

        <!-- ================= VISTA 2: CALENDARIO / FECHAS IMPORTANTES ================= -->
        <div id="vista-calendario" class="hidden">
            <h2 class="text-xl font-bold text-slate-800 mb-4">📅 Calendario de Eventos y Exámenes</h2>
            
            <!-- Formulario para agregar evento -->
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-6">
                <h3 class="text-sm font-semibold text-slate-700 mb-3">Agregar Nueva Fecha Importante</h3>
                <form id="form-evento" onsubmit="agregarEvento(event)" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="evento-titulo" placeholder="Ej. Examen Parcial Programación I" required 
                           class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="evento-fecha" required 
                           class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg text-sm hover:bg-blue-700 transition shadow-sm">
                        ➕ Guardar Fecha
                    </button>
                </form>
            </div>

            <!-- Lista de Eventos Guardados -->
            <div id="eventos-list" class="space-y-3">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

    </div>

    <script>
        // --- DATOS DE MATERIAS (Con persistencia LocalStorage) ---
        let materias = JSON.parse(localStorage.getItem('materias_uned')) || [
            { id: 0, nombre: "Procesos y Estrategias P. el Aprendizaje", estado: 1 },
            { id: 1, nombre: "Historia de la Cultura", estado: 1 },
            { id: 2, nombre: "Literatura Costarricense e Identidad Nacional", estado: 1 },
            { id: 3, nombre: "Perspectivas Filosóficas de la Ciencia", estado: 1 },
            { id: 4, nombre: "Aprendizaje y Cognición", estado: 1 },
            { id: 5, nombre: "Matemáticas I para Informática Educativa", estado: 1 },
            { id: 6, nombre: "Pedagogía de la Informática Educativa", estado: 1 },
            { id: 7, nombre: "Introducción a la Lógica", estado: 1 },
            { id: 8, nombre: "Matemáticas II para Informática Educativa", estado: 1 },
            { id: 9, nombre: "Inglés para Informática", estado: 1 },
            { id: 10, nombre: "Aplicaciones Informáticas para la Educación I", estado: 0 },
            { id: 11, nombre: "Programación I", estado: 1 },
            { id: 12, nombre: "Fundamentos del Currículum", estado: 0 },
            { id: 13, nombre: "Inglés para Informática II", estado: 0 },
            { id: 14, nombre: "Diseño Curricular en la Informática Educativa", estado: 0 },
            { id: 15, nombre: "Programación II", estado: 0 },
            { id: 16, nombre: "Diseño de material didáctico apoyado en TIC", estado: 0 },
            { id: 17, nombre: "Comunicación en Ambientes Presenciales y Virtuales", estado: 1 },
            { id: 18, nombre: "Bases de Datos", estado: 0 },
            { id: 19, nombre: "Fundamentos y Metodología de la Investigación I", estado: 0 },
            { id: 20, nombre: "Evaluación de los Aprendizajes", estado: 1 },
            { id: 21, nombre: "Fundamentos y Metodología de la Investigación en Educación II", estado: 0 },
            { id: 22, nombre: "Didáctica General I", estado: 0 },
            { id: 23, nombre: "Programación III", estado: 0 },
            { id: 24, nombre: "Evaluación de Hardware y Software", estado: 0 },
            { id: 25, nombre: "Programación IV", estado: 0 },
            { id: 26, nombre: "Telecomunicaciones Educativas I", estado: 0 },
            { id: 27, nombre: "Didáctica de la Informática Educativa", estado: 0 },
            { id: 28, nombre: "Aplicaciones de la Informática a la Educación II", estado: 0 },
            { id: 29, nombre: "Las TIC en entornos inclusivos", estado: 0 },
            { id: 30, nombre: "Robótica en la Informática Educativa", estado: 0 },
            { id: 31, nombre: "Telecomunicaciones Educativas II", estado: 0 },
            { id: 32, nombre: "Educación para la Paz", estado: 1 },
            { id: 33, nombre: "Educación para la Diversidad", estado: 0 },
            { id: 34, nombre: "Desarrollo de Software Educativo", estado: 0 },
            { id: 35, nombre: "Plataformas de Aprendizaje en Línea I", estado: 0 },
            { id: 36, nombre: "Teorías del Aprendizaje", estado: 1 },
            { id: 37, nombre: "Teorías de la Inteligencia", estado: 1 },
            { id: 38, nombre: "Ética Profesional Docente", estado: 1 },
            { id: 39, nombre: "Diseño de Aplicaciones para Ambientes Educativos I", estado: 0 },
            { id: 40, nombre: "Desarrollo de la Creatividad", estado: 1 },
            { id: 41, nombre: "Telepresencia", estado: 0 },
            { id: 42, nombre: "Recursos Audiovisuales", estado: 0 },
            { id: 43, nombre: "Práctica Docente", estado: 0 }
        ];

        // --- DATOS DE EVENTOS / CALENDARIO ---
        let eventos = JSON.parse(localStorage.getItem('eventos_uned')) || [
            { id: 1, titulo: "Matrícula Primer Cuatrimestre", fecha: "2026-09-01" },
            { id: 2, titulo: "Entrega de Proyecto Programación I", fecha: "2026-10-15" }
        ];

        let filtroActual = 'todas';

        // --- FUNCIONES DE NAVEGACIÓN ---
        function cambiarVista(vista) {
            const vPlan = document.getElementById('vista-plan');
            const vCal = document.getElementById('vista-calendario');
            const bPlan = document.getElementById('btn-vista-plan');
            const bCal = document.getElementById('btn-vista-calendario');

            if (vista === 'plan') {
                vPlan.classList.remove('hidden');
                vCal.classList.add('hidden');
                bPlan.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-800 text-white shadow-sm";
                bCal.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-200 text-slate-700 hover:bg-slate-300";
            } else {
                vPlan.classList.add('hidden');
                vCal.classList.remove('hidden');
                bCal.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-800 text-white shadow-sm";
                bPlan.className = "px-5 py-2.5 rounded-lg text-sm font-semibold transition bg-slate-200 text-slate-700 hover:bg-slate-300";
                renderizarEventos();
            }
        }

        // --- FUNCIONES PLAN DE ESTUDIO ---
        function cambiarEstado(id) {
            const materia = materias.find(m => m.id === id);
            if (materia) {
                materia.estado = materia.estado === 1 ? 0 : 1;
                localStorage.setItem('materias_uned', JSON.stringify(materias));
                actualizarTodoPlan();
            }
        }

        function actualizarContadores() {
            const total = materias.length;
            const pasadas = materias.filter(m => m.estado === 1).length;
            const restantes = total - pasadas;

            document.getElementById('total-count').textContent = total;
            document.getElementById('passed-count').textContent = pasadas;
            document.getElementById('remaining-count').textContent = restantes;
        }

        function renderizarMaterias() {
            const contenedor = document.getElementById('materias-list');
            contenedor.innerHTML = '';

            let filtradas = materias;
            if (filtroActual === 'aprobadas') {
                filtradas = materias.filter(m => m.estado === 1);
            } else if (filtroActual === 'restantes') {
                filtradas = materias.filter(m => m.estado === 0);
            }

            filtradas.forEach(materia => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-lg border transition ${
                    materia.estado === 1 ? 'bg-emerald-50/50 border-emerald-200' : 'bg-amber-50/50 border-amber-200'
                }`;

                div.innerHTML = `
                    <span class="text-slate-700 font-medium pr-2 text-sm md:text-base">${materia.nombre}</span>
                    <button onclick="cambiarEstado(${materia.id})" class="px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm transition cursor-pointer whitespace-nowrap ${
                        materia.estado === 1 
                        ? 'bg-emerald-600 text-white hover:bg-emerald-700' 
                        : 'bg-amber-600 text-white hover:bg-amber-700'
                    }">
                        ${materia.estado === 1 ? '✓ Aprobada' : '⏳ Restante'}
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        function filtrar(tipo) {
            filtroActual = tipo;
            renderizarMaterias();
        }

        function actualizarTodoPlan() {
            actualizarContadores();
            renderizarMaterias();
        }

        // --- FUNCIONES CALENDARIO ---
        function agregarEvento(e) {
            e.preventDefault();
            const titulo = document.getElementById('evento-titulo').value;
            const fecha = document.getElementById('evento-fecha').value;

            const nuevoEvento = {
                id: Date.now(),
                titulo,
                fecha
            };

            eventos.push(nuevoEvento);
            // Ordenar por fecha cercana
            eventos.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

            localStorage.setItem('eventos_uned', JSON.stringify(eventos));
            document.getElementById('form-evento').reset();
            renderizarEventos();
        }

        function eliminarEvento(id) {
            eventos = eventos.filter(ev => ev.id !== id);
            localStorage.setItem('eventos_uned', JSON.stringify(eventos));
            renderizarEventos();
        }

        function renderizarEventos() {
            const contenedor = document.getElementById('eventos-list');
            contenedor.innerHTML = '';

            if (eventos.length === 0) {
                contenedor.innerHTML = `<p class="text-slate-400 text-center py-4 text-sm">No hay fechas importantes registradas.</p>`;
                return;
            }

            eventos.forEach(ev => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-3 rounded-lg border border-slate-200 bg-white shadow-xs";

                // Formatear fecha para legibilidad
                const fechaLegible = new Date(ev.fecha + 'T00:00:00').toLocaleDateString('es-ES', {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                });

                div.innerHTML = `
                    <div>
                        <p class="text-slate-800 font-semibold text-sm md:text-base">${ev.titulo}</p>
                        <p class="text-blue-600 text-xs font-medium">🗓️ ${fechaLegible}</p>
                    </div>
                    <button onclick="eliminarEvento(${ev.id})" class="text-red-500 hover:text-red-700 text-xs font-semibold px-2.5 py-1 bg-red-50 rounded-md transition">
                        Eliminar
                    </button>
                `;
                contenedor.appendChild(div);
            });
        }

        // Inicializar aplicación
        actualizarTodoPlan();
    </script>
</body>
</html>
